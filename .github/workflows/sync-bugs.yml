name: Sync bug reports

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize bug reports
        env:
          GITHUB_TOKEN: ${{ secrets.BUGS_GITHUB_TOKEN }}
          GITHUB_OWNER: VanillaSquared
          GITHUB_REPOSITORY: Issues
        run: node scripts/sync-bugs.mjs

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- src/bugs/data.json; then
            echo "Bug report snapshot is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bugs/data.json
          git commit -m "chore: sync bug report snapshot"
          git push
